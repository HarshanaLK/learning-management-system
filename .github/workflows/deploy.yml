
name: LMS CI/CD Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy LMS to AWS EC2

    runs-on:
      - self-hosted
      - linux
      - x64
      - lms-prod

    steps:
      - name: Deploy Laravel LMS
        run: sudo -n /usr/local/bin/deploy-lms
