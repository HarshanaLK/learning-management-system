name: LMS CI and EC2 Deploy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lms-production
  cancel-in-progress: false

jobs:
  verify:
    name: PHP dependencies and Vite build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, intl, gd, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Check Composer security advisories
        run: composer audit --locked
      - name: Install frontend dependencies
        run: npm ci
      - name: Build client and Inertia SSR
        run: npm run build

  deploy:
    name: Deploy through AWS Systems Manager
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy LMS on EC2
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "LMS-Deploy" \
            --comment "GitHub LMS main deployment" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"
          status=Pending
          for i in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|TimedOut|Cancelled|Cancelling) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json
          test "$status" = Success
